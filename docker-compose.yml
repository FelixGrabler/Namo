services:
  db:
    image: postgres:16-alpine
    container_name: namo-db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: namo_prod
      POSTGRES_PASSWORD_FILE: /run/secrets/prod_postgres_password
      POSTGRES_DB: namo_prod
    volumes:
      - db-data-prod:/var/lib/postgresql/data
    secrets:
      - prod_postgres_password
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "namo_prod", "-d", "namo_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    container_name: namo-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8061:8000"
    environment:
      ENVIRONMENT: production
      INIT_DB_ON_STARTUP: "false"
      POSTGRES_USER: namo_prod
      POSTGRES_DB: namo_prod
      DATABASE_HOST: db
      DEBUG: "false"
      RELOAD: "false"
      LOG_LEVEL: "info"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "720"
      AUTH_SERVICE_URL: "http://shared-auth:8000/api/auth"
      CORS_ORIGINS: "https://namo.grabler.me"
      GUNICORN_TIMEOUT: "120"
      LOG_MAX_SIZE_MB: "50"
      LOG_BACKUP_COUNT: "5"
      LOG_CONSOLE: "false"
    secrets:
      - source: prod_postgres_password
        target: postgres_password
      - source: prod_secret_key
        target: secret_key
      - source: prod_telegram_bot_token
        target: telegram_bot_token
      - source: prod_telegram_chat_id
        target: telegram_chat_id
    networks:
      default: {}
      grabler-network:
        aliases:
          - namo-backend

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    container_name: namo-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8060:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    environment:
      VITE_API_URL: "https://namo.grabler.me"
      VITE_ENVIRONMENT: "production"
      VITE_APP_NAME: "Namo"
    networks:
      default: {}
      grabler-network:
        aliases:
          - namo-frontend

  backups:
    image: postgres:16-alpine
    container_name: namo-backups
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_HOST: db
      POSTGRES_USER: namo_prod
      POSTGRES_DB: namo_prod
      BACKUP_DIR: /backups
      BACKUP_RETENTION: "10"
      BACKUP_CRON: "0 3 * * 0"
    secrets:
      - source: prod_postgres_password
        target: prod_postgres_password
    volumes:
      - db-backups:/backups
      - ./app/backup/backup.sh:/backup/backup.sh:ro
    command: >
      sh -c "echo \"$BACKUP_CRON /backup/backup.sh\" > /etc/crontabs/root
      && crond -f -l 8"

secrets:
  prod_postgres_password:
    file: ./secrets/prod_postgres_password.txt
  prod_secret_key:
    file: ./secrets/prod_secret_key.txt
  prod_telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt
  prod_telegram_chat_id:
    file: ./secrets/prod_telegram_chat_id.txt

volumes:
  db-data-prod:
  db-backups:

networks:
  grabler-network:
    external: true
