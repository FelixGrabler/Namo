services:
  db:
    image: postgres:16-alpine
    container_name: postgres_dev
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: namo_dev
      POSTGRES_PASSWORD_FILE: /run/secrets/dev_postgres_password
      POSTGRES_DB: namo_dev
    volumes:
      - db-data:/var/lib/postgresql/data
    secrets:
      - dev_postgres_password
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "namo_dev", "-d", "namo_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile.dev
    container_name: api_dev
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8060:8000"
    volumes:
      - ./app/backend:/app/backend
      - ./logs:/app/backend/logs
    environment:
      ENVIRONMENT: development
      POSTGRES_USER: namo_dev
      POSTGRES_DB: namo_dev
      DATABASE_HOST: db
      DEBUG: "true"
      RELOAD: "true"
      LOG_LEVEL: "debug"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "10080"
      LOG_MAX_SIZE_MB: "10"
      LOG_BACKUP_COUNT: "3"
      LOG_CONSOLE: "true"
    secrets:
      - dev_postgres_password
      - dev_secret_key
      - dev_telegram_bot_token
      - dev_telegram_chat_id
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile.dev
    container_name: web_dev
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - ./app/frontend:/app/frontend
      - /app/frontend/node_modules
    environment:
      VITE_API_URL: "http://localhost:8060"
      VITE_ENVIRONMENT: "development"
      VITE_APP_NAME: "Namo Dev"

secrets:
  dev_postgres_password:
    file: ./secrets/dev_postgres_password.txt
  dev_secret_key:
    file: ./secrets/dev_secret_key.txt
  dev_telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt
  dev_telegram_chat_id:
    file: ./secrets/dev_telegram_chat_id.txt

volumes:
  db-data:

networks:
  grabler-network:
    external: true
